<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Clipboard / list shape -->
  <rect x="116" y="96" width="280" height="320" rx="24" fill="white" filter="url(#shadow)" stroke="#E2E8F0" stroke-width="2"/>
  <!-- Clip at top for clipboard notch -->
  <rect x="216" y="76" width="80" height="32" rx="16" fill="white" stroke="#E2E8F0" stroke-width="2"/>
  <!-- List lines -->
  <rect x="156" y="160" width="140" height="12" rx="6" fill="#E2E8F0"/>
  <rect x="156" y="208" width="180" height="12" rx="6" fill="#E2E8F0"/>
  <rect x="156" y="256" width="120" height="12" rx="6" fill="#E2E8F0"/>
  <!-- Checkmark circle + icon -->
  <circle cx="356" cy="212" r="52" fill="url(#accent)"/>
  <path d="M332 212l18 18 36-36" stroke="white" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
